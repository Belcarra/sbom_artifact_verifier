name: Cloudflare Pages
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: verifier-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verifier-pages-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: Deploy tested assets
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        run: npm run deploy:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify deployed assets
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        run: node tools/verify-pages.cjs https://belcarra-verifier.pages.dev/
